<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D FPS Arena</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background-color: #000;
        font-family: sans-serif;
      }
      #crosshair {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 10px;
        height: 10px;
        transform: translate(-50%, -50%);
        pointer-events: none;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #crosshair::before,
      #crosshair::after {
        content: '';
        position: absolute;
        background-color: rgba(255, 255, 255, 0.8);
      }
      #crosshair::before {
        width: 2px;
        height: 10px;
      }
      #crosshair::after {
        width: 10px;
        height: 2px;
      }
      #blocker {
        position: absolute;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.6);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        color: #ffffff;
        cursor: pointer;
        z-index: 10;
      }
      #instructions {
        font-size: 24px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div id="blocker">
      <div id="instructions">
        <p style="font-size: 36px">Click to Play</p>
        <p>Move: WASD | Jump: SPACE | Look: MOUSE</p>
      </div>
    </div>
    <div id="crosshair"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
